[package]
name = "audio-relay-desktop"
version = "0.1.0"
edition = "2021"
description = "Captures desktop system audio (WASAPI loopback on Windows, PulseAudio monitor capture on Linux) and relays it to the audio-relay Android app over the LAN."
license = "MIT"
repository = "https://github.com/JeelGajera/audio-relay"
publish = false

[[bin]]
name = "audio-relay"
path = "src/main.rs"

# Built by `cargo deb` (see .github/workflows/release.yml's build-linux job)
# alongside the existing portable .tar.gz — an apt/dpkg-installable option
# for people who'd rather have it on their PATH and in their package
# manager than unpack a tarball. `depends = "$auto"` alone is enough:
# cargo-deb's ldd-based detection already resolves the real runtime need —
# `libpulse0` (which ships both `libpulse.so.0` and `libpulse-simple.so.0`
# on Debian/Ubuntu) — verified by actually building this package rather
# than assumed; see `capture::linux_impl`'s module doc for why only that
# one package is needed.
[package.metadata.deb]
name = "audio-relay"
maintainer = "audio-relay contributors <https://github.com/JeelGajera/audio-relay>"
copyright = "2026, audio-relay contributors"
license-file = ["../LICENSE", "0"]
extended-description = """\
Captures this machine's system audio (via PulseAudio, or PipeWire's \
pipewire-pulse compatibility layer) and relays it over the local network \
to the audio-relay Android app, which plays it back through whatever \
Bluetooth device is already connected. See \
https://github.com/JeelGajera/audio-relay for the Android app and full \
documentation."""
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/audio-relay", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/audio-relay/README.md", "644"],
    ["README.md", "usr/share/doc/audio-relay/README.desktop-app.md", "644"],
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }
mdns-sd = "0.11"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
hostname = "0.4"

[target.'cfg(windows)'.dependencies]
wasapi = "0.15"
# Already in the tree transitively via wasapi; taken as a direct dependency
# (pinned to the same version, so no second copy is built) for the Mica
# backdrop, immersive dark titlebar and the system accent colour. Only the
# few feature modules those need are enabled.
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    # For "Also play locally while relaying" (capture/mod.rs's
    # windows_impl::set_endpoint_mute): activates IAudioEndpointVolume on
    # the selected render endpoint by ID, independent of the `wasapi` crate
    # (whose `Device` type doesn't expose endpoint-volume control).
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
# Build-time only: stamps the generated .ico and version info into the .exe.
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Loopback capture via each sink's PulseAudio ".monitor" source — see
# `capture::linux_impl` doc comment. `libpulse-simple-binding` covers the
# blocking read side; `libpulse-binding` is needed on top of it purely for
# device enumeration (the Simple API has no introspection of its own).
# Safe wrappers over `libpulse-sys`/`libpulse-simple-sys`, not hand-rolled
# FFI. Requires `libpulse-dev` (or distro equivalent) at build time.
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
