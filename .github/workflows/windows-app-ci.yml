name: windows-app CI

on:
  push:
    branches: [master]
    paths:
      - "windows-app/**"
      - "protocol-spec.md"
      - ".github/workflows/windows-app-ci.yml"
  pull_request:
    paths:
      - "windows-app/**"
      - "protocol-spec.md"
      - ".github/workflows/windows-app-ci.yml"
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: windows-app

jobs:
  # Fast checks on Linux: protocol/network/config modules are platform-independent
  # (capture/ is cfg(windows)-gated), so we can lint/test most of the crate here.
  check-cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  # Real target: full build including the WASAPI capture path.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test
      # Keep the binary this job already built, so a reviewer can try a change
      # without a Rust toolchain. Not a release artifact — see release.yml.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: audio-relay-windows-x86_64-${{ github.sha }}
          path: windows-app/target/release/audio-relay.exe
          if-no-files-found: error
          retention-days: 14
