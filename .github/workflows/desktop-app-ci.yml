name: desktop-app CI

on:
  push:
    branches: [master]
    paths:
      - "desktop-app/**"
      - "protocol-spec.md"
      - ".github/workflows/desktop-app-ci.yml"
  pull_request:
    paths:
      - "desktop-app/**"
      - "protocol-spec.md"
      - ".github/workflows/desktop-app-ci.yml"
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop-app

jobs:
  # Fast checks on Linux: protocol/network/config modules are platform-independent,
  # and the PulseAudio capture backend (capture::linux_impl) is real Linux code —
  # only the WASAPI path (capture::windows_impl) is cfg(windows)-gated, so we can
  # lint/test the rest of the crate, plus type-check the Windows target, here.
  check-cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpulse-dev
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Type-checking the Windows target from Linux catches mistakes in
          # cfg(windows) code in seconds. Without it, an error in the WASAPI
          # or DWM paths is only found by the full Windows build below.
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (windows target)
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: test
        run: cargo test

  # Real target: full build including the WASAPI capture path.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test
      # Keep the binary this job already built, so a reviewer can try a change
      # without a Rust toolchain. Not a release artifact — see release.yml.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: audio-relay-windows-x86_64-${{ github.sha }}
          path: desktop-app/target/release/audio-relay.exe
          if-no-files-found: error
          retention-days: 14

  # Real target: full build including the PulseAudio capture path.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpulse-dev
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test
      # Keep the binary this job already built, so a reviewer can try a change
      # without a Rust toolchain. Not a release artifact — see release.yml.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: audio-relay-linux-x86_64-${{ github.sha }}
          path: desktop-app/target/release/audio-relay
          if-no-files-found: error
          retention-days: 14
