name: android-app CI

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "protocol-spec.md"
      - ".github/workflows/android-app-ci.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "protocol-spec.md"
      - ".github/workflows/android-app-ci.yml"

defaults:
  run:
    working-directory: android-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lint
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
