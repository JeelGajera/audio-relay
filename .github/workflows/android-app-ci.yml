name: android-app CI

on:
  push:
    branches: [master]
    paths:
      - "android-app/**"
      - "protocol-spec.md"
      - ".github/workflows/android-app-ci.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "protocol-spec.md"
      - ".github/workflows/android-app-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lint
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      # Proves the release variant builds — minification and resource shrinking
      # only run here, so without this a release-only break would surface for
      # the first time during an actual release.
      - name: Assemble release APK
        run: ./gradlew assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-relay-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      # Test reports are the only way to see which assertions ran when a
      # remote build fails, so keep them even on failure.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ github.sha }}
          path: android-app/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
