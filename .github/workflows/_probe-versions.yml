# TEMPORARY: resolves current Google-Maven versions so the Android toolchain
# upgrade can be pinned to real values rather than guessed. Deleted before
# this branch is merged.
name: probe versions

on:
  push:
    branches: [feat/modern-ui-and-release-pipeline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest released versions from Google Maven
        run: |
          probe() {
            echo "=== $1 ==="
            curl -sS "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" \
              | grep -o '<version>[^<]*</version>' \
              | sed 's/<[^>]*>//g' \
              | grep -Ev 'alpha|beta|rc|dev' \
              | tail -5
          }
          probe com/android/tools/build/gradle
          probe androidx/compose/compose-bom
          probe androidx/compose/material3/material3
          probe androidx/navigation/navigation-compose
          probe androidx/lifecycle/lifecycle-runtime-compose
          probe androidx/core/core-splashscreen
          probe androidx/activity/activity-compose
          probe androidx/core/core-ktx
          probe androidx/lifecycle/lifecycle-service
          probe androidx/media/media
          probe androidx/test/ext/junit
